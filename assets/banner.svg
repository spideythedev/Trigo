<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="40%" stop-color="#1E1B4B"/>
<stop offset="100%" stop-color="#312E81"/>
</linearGradient>

<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#818CF8"/>
<stop offset="100%" stop-color="#60A5FA"/>
</linearGradient>

<radialGradient id="glow">
<stop offset="0%" stop-color="#818CF8" stop-opacity=".35"/>
<stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
</radialGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="45"/>
</filter>

<style>
text{
font-family:Inter,Segoe UI,Arial,sans-serif;
}

.title{
font-size:74px;
font-weight:800;
fill:white;
letter-spacing:-2px;
}

.subtitle{
font-size:25px;
font-weight:500;
fill:#CBD5E1;
}

.small{
font-size:18px;
font-weight:600;
fill:#E2E8F0;
}

.card{
fill:rgba(255,255,255,.04);
stroke:rgba(255,255,255,.12);
stroke-width:1.4;
rx:18;
}

.float{
animation:float 8s ease-in-out infinite;
}

.float2{
animation:float 11s ease-in-out infinite;
}

.float3{
animation:float 14s ease-in-out infinite;
}

.rotate{
transform-origin:center;
animation:spin 28s linear infinite;
}

.pulse{
animation:pulse 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

@keyframes pulse{
0%,100%{opacity:.4}
50%{opacity:1}
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}
</style>

</defs>

<rect width="1600" height="420" rx="30" fill="url(#bg)"/>

<circle cx="250" cy="90" r="130" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
<circle cx="1370" cy="310" r="150" fill="url(#glow)" filter="url(#blur)" class="pulse"/>

<!-- Grid -->
<g opacity=".06">
<path d="M0 60H1600M0 120H1600M0 180H1600M0 240H1600M0 300H1600M0 360H1600"
stroke="white"/>
<path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420M1200 0V420M1320 0V420M1440 0V420"
stroke="white"/>
</g>

<!-- Floating circles -->
<g class="rotate" opacity=".15">
<circle cx="1350" cy="90" r="55" stroke="#818CF8" stroke-width="2"/>
<circle cx="1350" cy="90" r="28" stroke="#60A5FA" stroke-width="2"/>
</g>

<circle cx="1260" cy="145" r="7" fill="#60A5FA" class="float"/>
<circle cx="1415" cy="185" r="5" fill="#818CF8" class="float2"/>
<circle cx="1325" cy="250" r="8" fill="#A5B4FC" class="float3"/>

<!-- Main Text -->

<text x="120" y="150" class="title">Trigo.js</text>

<text x="120" y="195" class="subtitle">
The Ultimate JavaScript Trigger Engine
</text>

<text x="120" y="235" class="subtitle">
Animations • Device APIs • Canvas • Audio • Browser APIs
</text>

<!-- Pills -->

<rect x="120" y="285" width="190" height="46" rx="23" fill="#2563EB22" stroke="#2563EB"/>
<text x="215" y="314" text-anchor="middle" class="small">⚡ 483+ Triggers</text>

<rect x="330" y="285" width="225" height="46" rx="23" fill="#3B82F622" stroke="#3B82F6"/>
<text x="442" y="314" text-anchor="middle" class="small">📦 Zero Dependencies</text>

<rect x="575" y="285" width="170" height="46" rx="23" fill="#60A5FA22" stroke="#60A5FA"/>
<text x="660" y="314" text-anchor="middle" class="small">🚀 CDN Ready</text>

<rect x="765" y="285" width="205" height="46" rx="23" fill="#818CF822" stroke="#818CF8"/>
<text x="867" y="314" text-anchor="middle" class="small">🎨 Modern API</text>

<!-- Right Feature Cards -->

<rect x="1110" y="80" width="330" height="70" rx="18" class="card"/>
<text x="1140" y="122" class="small">✨ Rich Animation Engine</text>

<rect x="1140" y="170" width="290" height="70" rx="18" class="card"/>
<text x="1170" y="212" class="small">📱 Mobile & Desktop Ready</text>

<rect x="1080" y="260" width="360" height="70" rx="18" class="card"/>
<text x="1110" y="302" class="small">⚡ Lightweight • Fast • Elegant</text>

</svg>